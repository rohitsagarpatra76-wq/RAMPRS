services:
  - type: web
    name: ramprs-ai-mirror
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn model_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: "true"
      - key: LIGHT_MODE
        value: "true"
